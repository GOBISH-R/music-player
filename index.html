<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pulse Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <div class="sidebar">
        <div class="logo">🎵 Pulse</div>

        <ul class="menu">
            <li class="active">Home</li>
            <li>Search</li>
            <li>Your Library</li>
        </ul>

        <div class="playlist-title">Playlists</div>
        <ul class="playlist">
            <li>Liked Songs</li>
            <li>Chill Beats</li>
            <li>Focus Mix</li>
            <li>Workout Mix</li>
        </ul>
    </div>

    <div class="main">
        <div class="top-bar">
            <h2>Pulse Player</h2>
            <input type="text" placeholder="Search songs, artists, playlists">
        </div>

        <h3>Your Playlists</h3>

        <div class="cards">
            <div class="card blue">Chill Beats</div>
            <div class="card green">Focus Mix</div>
            <div class="card orange">Workout Mix</div>
            <div class="card purple">Liked Songs</div>
            <div class="card pink">Evening Vibes</div>
            <div class="card sky">Instrumentals</div>
            <div class="card teal">Top Hits</div>
            <div class="card violet">Deep Focus</div>
        </div>
    </div>

</div>

</body>
</html>
